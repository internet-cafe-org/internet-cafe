openapi: 3.0.3
info:
  title: Internet Cafe API - Contrato 
  version: 0.1.0
  description: Contrato de datos y endpoints para registro asíncrono, enrolamiento con JWK, credenciales provisionales y long-polling.

paths:
  /api/v1/registro:
    post:
      summary: Registro inicial de usuario o dispositivo
      description: Inicia el proceso de registro devolviendo un código 202 indicando aceptación para procesamiento asíncrono.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identificacion
                - correo
                - rol
              properties:
                identificacion:
                  type: string
                  example: "123456789"
                correo:
                  type: string
                  format: email
                  example: "usuario@ejemplo.com"
                rol:
                  type: string
                  example: "cliente"
      responses:
        '202':
          description: Solicitud aceptada y en proceso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado:
                    type: string
                    example: "procesando"
                  mensaje:
                    type: string
                    example: "Registro aceptado para procesamiento en segundo plano"

  /api/v1/enroll:
    post:
      summary: Enrolamiento con JWK y prueba de posesión
      description: Valida la clave pública JSON Web Key y la prueba criptográfica de posesión.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - jwk
                - prueba_posesion
              properties:
                jwk:
                  type: object
                  description: Estructura de clave pública JSON Web Key (RFC 7517).
                  example: {"kty": "RSA", "n": "...", "e": "AQAB"}
                prueba_posesion:
                  type: string
                  description: Firma criptográfica firmada con la clave privada correspondiente.
                  example: "eyJhbGciOiJSUzI1NiIs..."
      responses:
        '200':
          description: Enrolamiento completado con éxito.
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado:
                    type: string
                    example: "enrolado"
                  dispositivo_id:
                    type: string
                    example: "dev-98765"

  /api/v1/credencial-provisional:
    get:
      summary: Emisión de credencial provisional
      description: Entrega una credencial temporal bajo validación de seguridad previa.
      parameters:
        - in: header
          name: X-Device-ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Credencial provisional generada correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  credencial_temporal:
                    type: string
                    example: "temp-token-xyz-789"
                  expiracion_segundos:
                    type: integer
                    example: 300

  /api/v1/long-poll:
    get:
      summary: Canal de sondeo largo (Long-Poll)
      description: Mantiene la conexión abierta hasta que ocurra un evento relevante para el cliente.
      parameters:
        - in: query
          name: ultimo_evento_id
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Evento recibido satisfactoriamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  evento_id:
                    type: string
                    example: "evt-456"
                  tipo:
                    type: string
                    example: "sesion_autorizada"
                  datos:
                    type: object
                    example: {"terminal": "PC-05", "tiempo_restante": 3600}

  
  /api/v1/machine/challenges:
    post:
      summary: Generar un reto QR para una máquina
      description: Crea un reto QR de un solo uso para el equipo identificado.
      parameters:
        - in: header
          name: x-machine-code
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Reto QR creado correctamente.
          content:
            application/json:
              schema:
                type: object
                required:
                  - challenge_id
                  - qr_url
                  - expires_at
                  - rotate_after_s
                properties:
                  challenge_id:
                    type: string
                    format: uuid
                  qr_url:
                    type: string
                    format: uri
                  expires_at:
                    type: string
                    format: date-time
                  rotate_after_s:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/scan/preview:
    post:
      summary: Consultar vista previa de un reto QR
      description: Obtiene información del equipo antes de confirmar el acceso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Vista previa obtenida correctamente.
          content:
            application/json:
              schema:
                type: object
                required:
                  - machine
                  - expires_at
                  - active_session
                properties:
                  machine:
                    type: object
                    required:
                      - code
                      - lab
                    properties:
                      code:
                        type: string
                      lab:
                        type: string
                  expires_at:
                    type: string
                    format: date-time
                  active_session:
                    type: object
                    nullable: true
                    properties:
                      machine_code:
                        type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'

  /api/v1/scan/claim:
    post:
      summary: Confirmar acceso escaneando el QR (Claim)
      description: Reclama el reto QR y crea la sesión de acceso para el estudiante de forma atómica.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        '201':
          description: Sesión creada exitosamente.
          content:
            application/json:
              schema:
                type: object
                required:
                  - session
                properties:
                  session:
                    type: object
                    required:
                      - id
                      - status
                      - started_at
                      - machine
                    properties:
                      id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        example: "active"
                      started_at:
                        type: string
                        format: date-time
                      machine:
                        type: object
                        required:
                          - id
                          - code
                          - lab
                        properties:
                          id:
                            type: string
                            format: uuid
                          code:
                            type: string
                          lab:
                            type: string
        '200':
          description: Reintento idempotente exitoso (devuelve la sesión existente).
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    type: object
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
  
components:
  schemas:
    ProblemDetails:
      type: object
      description: Formato de error conforme a RFC 9457.
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Código identificador del error.

  responses:
    Unauthorized:
      description: No autorizado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Acceso prohibido.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Recurso no encontrado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Conflicto con el estado actual del recurso.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Gone:
      description: Reto QR expirado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
