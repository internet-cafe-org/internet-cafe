openapi: 3.0.3
info:
  title: Internet Cafe API - Contrato
  version: 0.2.1
  description: 'Contrato de datos y endpoints. v0.2.1: agrega /auth/* (registro, login, refresh y logout), /machine/enroll,
    /healthz y /readyz; /scan/* exige el access token y /machine/challenges usa la autenticación del equipo; se
    retiran las rutas de v0.1 que nunca existieron en la API (/registro, /enroll, /credencial-provisional y /long-poll).
    v0.2 (BE-18): latido con `mode`, sesión actual y cierres del equipo; /me; administración; firma por petición
    del equipo.'
paths:
  /healthz:
    get:
      tags:
      - salud
      security: []
      summary: Liveness
      description: Responde sin tocar la base de datos. Fuera del prefijo `/api/v1`.
      responses:
        '200':
          description: La API está viva.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    example: ok
  /readyz:
    get:
      tags:
      - salud
      security: []
      summary: Readiness
      description: Verifica la conexión a la base de datos. Fuera del prefijo `/api/v1`.
      responses:
        '200':
          description: La base de datos responde.
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    example: ready
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/register:
    post:
      tags:
      - auth
      security: []
      summary: Registro de estudiante (SEC-02)
      description: Crea la cuenta con los datos personales cifrados (interfaz `pii`) y la contraseña en Argon2id.
        Con datos válidos responde **siempre 202**, también si el correo o el código ya existen; en ese caso no
        crea otra cuenta ni revela cuál existe (RF-AUT-01). En el MVP la cuenta queda activa (`REQUIRE_EMAIL_VERIFICATION=false`,
        backlog §4) y la web inicia sesión sola con `/auth/login`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - email
              - student_code
              - full_name
              - password
              - privacy_consent
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                  description: Correo institucional. Un dominio no permitido (`ALLOWED_EMAIL_DOMAINS`) devuelve
                    422.
                  example: ana.perez@universidad.edu.co
                student_code:
                  type: string
                  minLength: 4
                  maxLength: 20
                  pattern: ^[0-9A-Za-z-]+$
                  example: '2021123434'
                full_name:
                  type: string
                  minLength: 2
                  maxLength: 120
                  example: Ana Pérez
                password:
                  type: string
                  format: password
                  minLength: 10
                  maxLength: 128
                privacy_consent:
                  type: boolean
                  enum:
                  - true
                  description: Aceptación explícita del tratamiento de datos.
      responses:
        '202':
          description: Solicitud aceptada. Cuerpo vacío; no revela si la cuenta ya existía.
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      security: []
      summary: Inicio de sesión (SEC-02)
      description: Emite el access token ES256 (10 min, `aud = web`) y pone la cookie de refresh `__Secure-rt`.
        Credenciales inválidas → 401 `AUTH_INVALID_CREDENTIALS` sin distinguir si el correo existe; cuenta bloqueada
        por el administrador → 401 `AUTH_INVALID_CREDENTIALS`; cuenta sin verificar (solo con `REQUIRE_EMAIL_VERIFICATION=true`)
        → 403 `AUTH_EMAIL_NOT_VERIFIED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  format: password
                  minLength: 1
                  maxLength: 128
      responses:
        '200':
          description: Sesión iniciada.
          headers:
            Set-Cookie:
              description: '`__Secure-rt=<refresh opaco>; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth;
                Max-Age=604800`. El refresh nunca viaja en el cuerpo.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      security: []
      summary: Renovar el access token (SEC-03a)
      description: 'Rota el refresh de la cookie (revoca el usado y emite otro en la misma familia) y devuelve un
        access token nuevo. Sin cookie, desconocido, revocado o reutilizado → 401 `AUTH_INVALID_CREDENTIALS`; vencido
        → 401 `AUTH_TOKEN_EXPIRED`. Presentar un refresh ya revocado revoca toda la familia. Responde con `Cache-Control:
        no-store`.'
      parameters:
      - in: cookie
        name: __Secure-rt
        required: false
        description: Refresh token opaco de 256 bits; la API solo guarda su hash.
        schema:
          type: string
      - in: header
        name: Origin
        required: false
        description: Si viene, debe ser el origen permitido (`ALLOWED_ORIGIN`); si no, 403 `FORBIDDEN`.
        schema:
          type: string
      responses:
        '200':
          description: Access token renovado.
          headers:
            Set-Cookie:
              description: '`__Secure-rt=<refresh opaco>; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth;
                Max-Age=604800`. El refresh nunca viaja en el cuerpo.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      security: []
      summary: Cerrar la sesión web (SEC-03a)
      description: 'Revoca la familia del refresh de la cookie y la borra. Idempotente: responde 204 aunque no haya
        cookie.'
      parameters:
      - in: cookie
        name: __Secure-rt
        required: false
        description: Refresh token opaco de 256 bits; la API solo guarda su hash.
        schema:
          type: string
      - in: header
        name: Origin
        required: false
        description: Si viene, debe ser el origen permitido (`ALLOWED_ORIGIN`); si no, 403 `FORBIDDEN`.
        schema:
          type: string
      responses:
        '204':
          description: Sesión cerrada.
          headers:
            Set-Cookie:
              description: Borra la cookie `__Secure-rt` (`Max-Age=0`).
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/machine/enroll:
    post:
      tags:
      - machine
      security: []
      summary: Enrolar el equipo con su clave pública (SEC-05)
      description: 'El equipo envía el código de un solo uso, su clave pública en JWK (EC P-256, o RSA de 2048 a
        4096 bits con e = 65537 para la clave no exportable del TPM, ST-SEC-04) y una prueba de posesión: la firma
        SHA-256 de los bytes UTF-8 de `enrollment_code` en base64url sin relleno (ECDSA en `r||s` de 64 bytes con
        EC; RSASSA-PKCS1-v1_5 del largo del módulo con RSA). La API valida el JWK (sin parte privada), verifica la firma, calcula la huella RFC 7638
        (`keyid`), marca el código como usado, pasa el equipo a `active`, emite la credencial provisional (se muestra
        una sola vez; la API guarda solo su hash) y audita `machine.enroll`. Código inexistente, usado o vencido
        → 401 `ENROLLMENT_CODE_INVALID`; firma inválida → 401 `MACHINE_SIGNATURE_INVALID`; JWK inválido → 422; clave
        ya usada por otro equipo → 409 `CONFLICT`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - enrollment_code
              - jwk
              - proof
              properties:
                enrollment_code:
                  type: string
                  minLength: 8
                  maxLength: 64
                  description: Código de un solo uso; vence en 24 h.
                jwk:
                  $ref: '#/components/schemas/MachineJwk'
                proof:
                  type: string
                  description: Firma del código en base64url sin relleno. EC P-256 → `r||s` de 64 bytes; RSA →
                    RSASSA-PKCS1-v1_5 / SHA-256 del largo del módulo (256 bytes con 2048 bits).
                  example: MEUCIQ…
                hostname:
                  type: string
                  maxLength: 63
                  nullable: true
                app_version:
                  type: string
                  maxLength: 20
                  nullable: true
      responses:
        '201':
          description: Equipo enrolado.
          content:
            application/json:
              schema:
                type: object
                required:
                - machine_id
                - code
                - lab
                - mode
                - keyid
                - provisional_credential
                properties:
                  machine_id:
                    type: string
                    format: uuid
                  code:
                    type: string
                    example: LAB3-PC12
                  lab:
                    type: string
                    nullable: true
                    example: Sala 3 · Bloque B
                  mode:
                    $ref: '#/components/schemas/MachineMode'
                  keyid:
                    type: string
                    description: Huella RFC 7638 del JWK (base64url de SHA-256).
                    example: NzbLsXh8uDCcd-6MNwXF4W_7noWXFZAfHkxZsRGC9Xs
                  provisional_credential:
                    type: string
                    description: TRANSITORIO. Valor de `X-Machine-Key`. Se muestra una sola vez y se retira con
                      SEC-14, cuando la firma RFC 9421 sea obligatoria.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/machine/challenges:
    post:
      tags:
      - machine
      security:
      - machineSignature: []
      - machineProvisional: []
      summary: Generar un reto QR para una máquina
      description: Crea un reto QR de un solo uso para el equipo identificado. Máximo 2 retos vigentes por equipo
        (RN-06).
      responses:
        '201':
          description: Reto QR creado correctamente.
          content:
            application/json:
              schema:
                type: object
                required:
                - challenge_id
                - qr_url
                - expires_at
                - rotate_after_s
                properties:
                  challenge_id: &id001
                    type: string
                    format: uuid
                  qr_url:
                    type: string
                    format: uri
                  expires_at: &id002
                    type: string
                    format: date-time
                  rotate_after_s:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/machine/challenges/wait:
    get:
      tags:
      - machine
      security:
      - machineSignature: []
      - machineProvisional: []
      summary: Espera en long-poll de la aprobación de un reto QR
      description: Mantiene la conexión abierta hasta que un estudiante reclame el reto QR del equipo o venza el
        timeout.
      parameters:
      - in: query
        name: timeout
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 25
          default: 25
      responses:
        '200':
          description: Respuesta de long-poll (sesión aprobada o en espera).
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - approved
                    - waiting
                  session:
                    type: object
                    required:
                    - id
                    - status
                    - started_at
                    properties:
                      id: *id001
                      status:
                        type: string
                        example: active
                      started_at: *id002
                  user:
                    $ref: '#/components/schemas/StudentInfo'
                  recent_accesses:
                    type: array
                    items:
                      $ref: '#/components/schemas/RecentAccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/scan/preview:
    post:
      tags:
      - scan
      security:
      - bearerAuth: []
      summary: Consultar vista previa de un reto QR
      description: Obtiene información del equipo antes de confirmar el acceso. No consume el reto. Exige el access
        token del estudiante; el usuario sale del token, nunca de una cabecera.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Vista previa obtenida correctamente.
          content:
            application/json:
              schema:
                type: object
                required:
                - machine
                - expires_at
                - active_session
                properties:
                  machine:
                    type: object
                    required:
                    - code
                    - lab
                    properties:
                      code:
                        type: string
                      lab:
                        type: string
                  expires_at: *id002
                  active_session:
                    type: object
                    nullable: true
                    properties:
                      machine_code:
                        type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/scan/claim:
    post:
      tags:
      - scan
      security:
      - bearerAuth: []
      summary: Confirmar acceso escaneando el QR (Claim)
      description: Reclama el reto QR y crea la sesión de acceso para el estudiante de forma atómica. Exige el access
        token del estudiante; el usuario sale del token, nunca de una cabecera.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
      responses:
        '201':
          description: Sesión creada exitosamente.
          content:
            application/json:
              schema: &id003
                type: object
                required:
                - session
                properties:
                  session:
                    type: object
                    required:
                    - id
                    - status
                    - started_at
                    - machine
                    properties:
                      id: *id001
                      status:
                        type: string
                        example: active
                      started_at: *id002
                      machine:
                        type: object
                        required:
                        - id
                        - code
                        - lab
                        properties:
                          id: *id001
                          code:
                            type: string
                          lab:
                            type: string
        '200':
          description: Reintento idempotente exitoso (devuelve la sesión existente).
          content:
            application/json:
              schema: *id003
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/machine/heartbeat:
    post:
      tags:
      - machine
      security: &id004
      - machineSignature: []
      - machineProvisional: []
      summary: Latido del equipo (v0.2)
      description: 'El equipo lo envía cada 60 s. Devuelve la hora del servidor, el modo del equipo (`mode`) y el
        estado de su sesión. Es la vía por la que el equipo se entera de un cierre remoto (web, administrador o
        reemplazo): si no tiene sesión abierta y envía `session_id`, responde `ended` con `end_reason`. Solo equipos
        `active` pueden enviar latidos (RN-08). Toda marca de tiempo la fija el servidor (RN-01).'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatRequest'
      responses:
        '200':
          description: Latido registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/machine/sessions/current:
    get:
      tags:
      - machine
      security: *id004
      summary: Sesión actual del equipo (v0.2)
      description: Sesión abierta del equipo con el estudiante enmascarado y sus últimos accesos. 204 si el equipo
        no tiene sesión abierta.
      responses:
        '200':
          description: Sesión abierta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentSession'
        '204':
          description: El equipo no tiene sesión abierta.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/machine/sessions/current/end:
    post:
      tags:
      - machine
      security: *id004
      summary: Cerrar la sesión desde el equipo (v0.2)
      description: Cierra la sesión abierta del equipo con motivo `user_logout_pc` (por defecto) o `machine_shutdown`
        (apagado ordenado, mejor esfuerzo).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndSessionRequest'
      responses:
        '200':
          description: Sesión cerrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndedSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/me:
    get:
      tags:
      - me
      security: &id005
      - bearerAuth: []
      summary: Perfil del usuario (v0.2)
      description: Perfil del usuario autenticado. El código de estudiante se devuelve enmascarado.
      responses:
        '200':
          description: Perfil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/me/password:
    patch:
      tags:
      - me
      security:
      - bearerAuth: []
      summary: Cambiar la contraseña propia (SEC-02)
      description: >-
        Cambia la contraseña del usuario autenticado. Exige la contraseña actual.
        La nueva debe tener entre 10 y 128 caracteres y ser distinta de la actual.
        Al cambiarla se cierran las demás sesiones web (refresh tokens); la sesión
        que hizo el cambio sigue abierta. Una contraseña actual incorrecta responde
        401 `AUTH_CURRENT_PASSWORD_INVALID` (RF-AUT-10); un token inválido responde
        401 `AUTH_INVALID_CREDENTIALS` y uno vencido 401 `AUTH_TOKEN_EXPIRED`, así que el
        cliente los distingue por `code` y no cierra la sesión por una contraseña mal
        escrita. La nueva
        igual a la actual o fuera de 10 a 128 caracteres responde 422
        `VALIDATION_ERROR`. Límite por cuenta, 429 `RATE_LIMITED`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - current_password
              - new_password
              properties:
                current_password:
                  type: string
                  format: password
                  minLength: 1
                  maxLength: 128
                new_password:
                  type: string
                  format: password
                  minLength: 10
                  maxLength: 128
      responses:
        '204':
          description: Contraseña cambiada. Sin cuerpo.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Demasiados intentos. Espera lo indicado en `Retry-After`.
  /api/v1/me/sessions:
    get:
      tags:
      - me
      security: *id005
      summary: Historial de sesiones propias (v0.2)
      description: Historial paginado, de la más reciente a la más antigua.
      parameters:
      - &id006
        in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - &id007
        in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Página de sesiones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MySessionsPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/me/sessions/active:
    get:
      tags:
      - me
      security: *id005
      summary: Sesión activa propia (v0.2)
      description: 'Sesión abierta del usuario o `{"session": null}`.'
      responses:
        '200':
          description: Sesión activa o null.
          content:
            application/json:
              schema:
                type: object
                required:
                - session
                properties:
                  session:
                    $ref: '#/components/schemas/MySession'
                    nullable: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me/sessions/{id}/end:
    post:
      tags:
      - me
      security: *id005
      summary: Cerrar una sesión propia desde la web (v0.2)
      description: Cierra con motivo `user_logout_web`. Idempotente. El equipo se entera en su próximo latido (≤
        60 s). Una sesión ajena responde igual que una inexistente (404 `SESSION_NOT_FOUND`).
      parameters:
      - in: path
        name: id
        required: true
        schema: *id001
      responses:
        '200':
          description: Sesión (cerrada).
          content:
            application/json:
              schema:
                type: object
                required:
                - session
                properties:
                  session:
                    $ref: '#/components/schemas/MySession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/labs:
    get:
      tags:
      - admin
      security: *id005
      summary: Listar salas (v0.2)
      parameters:
      - *id006
      - *id007
      responses:
        '200':
          description: Página de salas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabsPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - admin
      security: *id005
      summary: Crear una sala (v0.2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabCreate'
      responses:
        '201':
          description: Sala creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lab'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/machines:
    get:
      tags:
      - admin
      security: *id005
      summary: Listar equipos (v0.2)
      parameters:
      - in: query
        name: lab_id
        schema: *id001
      - in: query
        name: status
        schema:
          $ref: '#/components/schemas/MachineStatus'
      - *id006
      - *id007
      responses:
        '200':
          description: Página de equipos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachinesPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/machines/{id}:
    patch:
      tags:
      - admin
      security: *id005
      summary: Editar sala, modo o estado de un equipo (v0.2)
      description: 'Deshabilitar un equipo (`status: disabled`) cancela sus retos pendientes y cierra su sesión
        abierta con `admin_forced` (RN-08). Activar un equipo que no se enroló responde 409 `CONFLICT`.'
      parameters:
      - in: path
        name: id
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MachinePatch'
      responses:
        '200':
          description: Equipo actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Machine'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/sessions:
    get:
      tags:
      - admin
      security: *id005
      summary: Consultar accesos con filtros (v0.2)
      parameters:
      - in: query
        name: machine_code
        schema:
          type: string
          maxLength: 40
      - in: query
        name: lab_id
        schema: *id001
      - in: query
        name: state
        schema:
          type: string
          enum:
          - active
          - ended
      - in: query
        name: started_from
        schema: *id002
        description: Inclusivo. Sin zona horaria se interpreta como UTC.
      - in: query
        name: started_to
        schema: *id002
        description: Exclusivo. Sin zona horaria se interpreta como UTC.
      - in: query
        name: student
        description: Correo o código exacto del estudiante (búsqueda por blind index).
        schema:
          type: string
          maxLength: 80
      - *id006
      - *id007
      responses:
        '200':
          description: Página de sesiones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionsPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/sessions/{id}/end:
    post:
      tags:
      - admin
      security: *id005
      summary: Cierre forzado de una sesión (v0.2)
      description: Cierra con motivo `admin_forced`. Idempotente. El equipo se entera en su próximo latido (≤ 60
        s).
      parameters:
      - in: path
        name: id
        required: true
        schema: *id001
      responses:
        '200':
          description: Sesión (cerrada).
          content:
            application/json:
              schema:
                type: object
                required:
                - session
                properties:
                  session:
                    $ref: '#/components/schemas/AdminSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/admin/sessions/export:
    get:
      tags:
      - admin
      security: *id005
      summary: Exportar accesos a CSV (ST-BE-03)
      description: Exporta los accesos filtrados. Devuelve un archivo CSV (UTF-8 con BOM, separador coma).
      parameters:
      - in: query
        name: machine_code
        schema:
          type: string
          maxLength: 40
      - in: query
        name: lab_id
        schema: *id001
      - in: query
        name: state
        schema:
          type: string
          enum:
          - active
          - ended
      - in: query
        name: started_from
        schema: *id002
        description: Inclusivo. Sin zona horaria se interpreta como UTC.
      - in: query
        name: started_to
        schema: *id002
        description: Exclusivo. Sin zona horaria se interpreta como UTC.
      - in: query
        name: student
        description: Correo o código exacto del estudiante (búsqueda por blind index).
        schema:
          type: string
          maxLength: 80
      responses:
        '200':
          description: Archivo CSV.
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token ES256 de 10 min (SEC-00). Rutas /me y /admin; /admin exige además `role = admin`.
    machineProvisional:
      type: apiKey
      in: header
      name: X-Machine-Key
      description: TRANSITORIO. Credencial provisional del equipo, enviada junto con `X-Machine-Code`; el servidor
        solo guarda su SHA-256 y la compara en tiempo constante. Se retira cuando Seguridad active la firma.
    machineSignature:
      type: apiKey
      in: header
      name: Signature
      description: 'OBJETIVO v0.2 (RFC 9421 + RFC 9530). Cabeceras: `Content-Digest: sha-256=:<base64>:`, `Signature-Input:
        sig1=("@method" "@target-uri" "content-digest");created=<epoch>;nonce="<id>";keyid="<thumbprint>";alg="ecdsa-p256-sha256"`
        y `Signature: sig1=:<r||s 64 bytes base64>:`. Con una clave RSA enrolada (TPM, ST-SEC-04) `alg="rsa-v1_5-sha256"`
        y la firma mide lo que el módulo; el `alg` debe ser el del tipo de la clave. Tolerancia de reloj ±30 s (`MACHINE_CLOCK_SKEW`), nonce no
        repetido en 60 s, firma inválida o repetida → `MACHINE_SIGNATURE_INVALID`. Estado: contrato propuesto; la
        verificación en el servidor la entrega el equipo de Seguridad.'
  schemas:
    ProblemDetail:
      type: object
      description: Error RFC 9457. Toda respuesta 4xx/5xx usa este esquema con `application/problem+json`. Nunca
        incluye credenciales, tokens, el valor enviado (`input`) ni trazas.
      required:
      - type
      - title
      - status
      - code
      - detail
      - instance
      properties:
        type:
          type: string
          format: uri
          example: https://errors.internet-cafe.example/challenge-expired
        title:
          type: string
          example: El código QR expiró
        status:
          type: integer
          example: 410
        code:
          type: string
          description: Código estable del catálogo (SRS §10.5).
          example: CHALLENGE_EXPIRED
        detail:
          type: string
          example: Escanea el código nuevo del equipo.
        instance:
          type: string
          description: Ruta de la petición, sin query string.
          example: /api/v1/scan/claim
        errors:
          type: array
          description: Solo en 422.
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required:
      - field
      - message
      properties:
        field:
          type: string
          example: body.password
        message:
          type: string
          example: String should have at least 12 characters
    StudentInfo:
      type: object
      required:
      - full_name
      - student_code_masked
      properties:
        full_name:
          type: string
          example: Ana Pérez
        student_code_masked:
          type: string
          example: 2021****34
    RecentAccess:
      type: object
      required:
      - machine_code
      - lab
      - started_at
      - ended_at
      - duration_s
      properties:
        machine_code:
          type: string
        lab:
          type: string
        started_at: *id002
        ended_at: *id002
        duration_s:
          type: integer
    SessionEndReason:
      type: string
      enum:
      - user_logout_pc
      - user_logout_web
      - superseded
      - heartbeat_timeout
      - admin_forced
      - machine_shutdown
    MachineStatus:
      type: string
      enum:
      - pending_enrollment
      - active
      - disabled
    MachineMode:
      type: string
      enum:
      - passive
      - kiosk
    HeartbeatRequest:
      type: object
      additionalProperties: false
      properties:
        session_id:
          type: string
          format: uuid
          nullable: true
          description: Sesión que el equipo cree tener abierta. Permite informarle un cierre remoto.
    HeartbeatResponse:
      type: object
      required:
      - server_time
      - mode
      - session_status
      properties:
        server_time: *id002
        mode:
          $ref: '#/components/schemas/MachineMode'
        session_status:
          type: string
          enum:
          - active
          - ended
          - none
          description: '`active`: hay sesión abierta. `ended`: la sesión indicada en la petición ya cerró (ver `end_reason`).
            `none`: no hay sesión.'
        session_id:
          type: string
          format: uuid
          description: Sesión abierta actual (`active`) o la indicada en la petición (`ended`). Si difiere de la
            que el equipo tiene, debe resincronizar con GET /machine/sessions/current.
        end_reason:
          $ref: '#/components/schemas/SessionEndReason'
    CurrentSession:
      type: object
      required:
      - session
      - user
      - recent_accesses
      properties:
        session:
          type: object
          required:
          - id
          - status
          - started_at
          properties:
            id: *id001
            status:
              type: string
              enum:
              - active
            started_at: *id002
        user:
          $ref: '#/components/schemas/StudentInfo'
        recent_accesses:
          type: array
          items:
            $ref: '#/components/schemas/RecentAccess'
    EndSessionRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          enum:
          - user_logout_pc
          - machine_shutdown
          default: user_logout_pc
    EndedSession:
      type: object
      required:
      - session
      properties:
        session:
          type: object
          required:
          - id
          - status
          - ended_at
          - end_reason
          properties:
            id: *id001
            status:
              type: string
              enum:
              - closed
            ended_at: *id002
            end_reason:
              $ref: '#/components/schemas/SessionEndReason'
    Profile:
      type: object
      required:
      - id
      - full_name
      - email
      - student_code_masked
      - role
      - status
      properties:
        id: *id001
        full_name:
          type: string
        email:
          type: string
          format: email
        student_code_masked:
          type: string
        role:
          type: string
          enum:
          - student
          - admin
        status:
          type: string
          enum:
          - pending_verification
          - active
          - blocked
    MySession:
      type: object
      required:
      - id
      - machine_code
      - lab
      - started_at
      properties:
        id: *id001
        machine_code:
          type: string
        lab:
          type: string
        started_at: *id002
        ended_at:
          type: string
          format: date-time
          nullable: true
        end_reason:
          $ref: '#/components/schemas/SessionEndReason'
          nullable: true
        duration_s:
          type: integer
          nullable: true
    MySessionsPage:
      type: object
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MySession'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    LabCreate:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        building:
          type: string
          maxLength: 80
          nullable: true
    Lab:
      type: object
      required:
      - id
      - name
      properties:
        id: *id001
        name:
          type: string
        building:
          type: string
          nullable: true
    LabsPage:
      type: object
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Lab'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    MachinePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        lab_id:
          type: string
          format: uuid
          nullable: true
          description: null desasigna la sala.
        mode:
          $ref: '#/components/schemas/MachineMode'
        status:
          type: string
          enum:
          - active
          - disabled
    Machine:
      type: object
      required:
      - id
      - code
      - status
      - mode
      properties:
        id: *id001
        code:
          type: string
        hostname:
          type: string
          nullable: true
        lab_id:
          type: string
          format: uuid
          nullable: true
        lab:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/MachineStatus'
        mode:
          $ref: '#/components/schemas/MachineMode'
        app_version:
          type: string
          nullable: true
        enrolled_at:
          type: string
          format: date-time
          nullable: true
        last_seen_at:
          type: string
          format: date-time
          nullable: true
    MachinesPage:
      type: object
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Machine'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    AdminSession:
      type: object
      required:
      - id
      - user
      - machine_code
      - lab
      - started_at
      - last_heartbeat_at
      properties:
        id: *id001
        user:
          type: object
          required:
          - id
          - full_name
          - student_code_masked
          properties:
            id: *id001
            full_name:
              type: string
            student_code_masked:
              type: string
        machine_code:
          type: string
        lab:
          type: string
        started_at: *id002
        last_heartbeat_at: *id002
        ended_at:
          type: string
          format: date-time
          nullable: true
        end_reason:
          $ref: '#/components/schemas/SessionEndReason'
          nullable: true
        duration_s:
          type: integer
          nullable: true
    AdminSessionsPage:
      type: object
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminSession'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    AccessToken:
      type: object
      description: Access token ES256 de 10 min. El cliente lo guarda en memoria; el refresh viaja solo en la cookie
        `__Secure-rt`.
      required:
      - access_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJFUzI1NiJ9…
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          description: Segundos de vida del access token.
          example: 600
    SessionUser:
      type: object
      required:
      - id
      - full_name
      - role
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
          example: Ana Pérez
        role:
          type: string
          enum:
          - student
          - admin
    LoginResponse:
      allOf:
      - $ref: '#/components/schemas/AccessToken'
      - type: object
        required:
        - user
        properties:
          user:
            $ref: '#/components/schemas/SessionUser'
    MachineJwk:
      description: Clave pública del equipo (RFC 7517). EC P-256 (clave PKCS12) o RSA (clave no exportable del TPM,
        ST-SEC-04). No puede incluir la parte privada.
      oneOf:
      - $ref: '#/components/schemas/MachineJwkEc'
      - $ref: '#/components/schemas/MachineJwkRsa'
      discriminator:
        propertyName: kty
        mapping:
          EC: '#/components/schemas/MachineJwkEc'
          RSA: '#/components/schemas/MachineJwkRsa'
    MachineJwkEc:
      type: object
      description: Clave pública EC P-256 (RFC 7517). No puede incluir la parte privada (`d`).
      required:
      - kty
      - crv
      - x
      - y
      additionalProperties: false
      properties:
        kty:
          type: string
          enum:
          - EC
        crv:
          type: string
          enum:
          - P-256
        x:
          type: string
          description: Coordenada x en base64url sin relleno (32 bytes).
          example: f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU
        y:
          type: string
          description: Coordenada y en base64url sin relleno (32 bytes).
          example: x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0
    MachineJwkRsa:
      type: object
      description: Clave pública RSA (RFC 7518 §6.3) de 2048 a 4096 bits con exponente 65537. Es la clave no
        exportable del TPM (HU-28). No puede incluir la parte privada (`d`, `p`, `q`, `dp`, `dq`, `qi`).
      required:
      - kty
      - n
      - e
      additionalProperties: false
      properties:
        kty:
          type: string
          enum:
          - RSA
        n:
          type: string
          minLength: 342
          maxLength: 683
          description: Módulo en base64url sin relleno y sin ceros a la izquierda.
        e:
          type: string
          enum:
          - AQAB
          description: Exponente público 65537 en base64url.
  responses:
    BadRequest:
      description: Petición inválida.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: 'No autorizado: token ausente o vencido, o firma/credencial del equipo inválida.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: 'Acceso prohibido: sin permisos, o equipo deshabilitado.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Recurso no encontrado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: Conflicto con el estado actual del recurso.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Gone:
      description: Reto QR expirado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ValidationError:
      description: 422 `VALIDATION_ERROR` con `errors[]` (`field` y `message`). Nunca devuelve el valor enviado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Locked:
      description: '423 `AUTH_ACCOUNT_LOCKED`: cuenta bloqueada 15 min tras 5 intentos fallidos (SEC-09).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    TooManyRequests:
      description: '429 `RATE_LIMITED`: demasiadas peticiones por cuenta o por IP (SEC-09). Incluye `Retry-After`.'
      headers:
        Retry-After:
          description: Segundos que hay que esperar.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ServiceUnavailable:
      description: '503 `INTERNAL_ERROR`: la base de datos no responde.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
