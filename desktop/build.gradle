plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'org.beryx.jlink' version '3.0.1'
    id 'com.diffplug.spotless' version '6.25.0'
}

group = 'org.internetcafe'
version = '0.1.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

javafx {
    version = '21.0.3'
    modules = ['javafx.controls', 'javafx.fxml']
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.google.zxing:javase:3.5.3'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.81'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

application {
    mainClass = 'org.internetcafe.desktop.Main'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.register('mockApi', JavaExec) {
    group = 'application'
    description = 'Levanta la API simulada local (DSK-07) en http://localhost:8000'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.internetcafe.desktop.mock.MockApiServer'
}
spotless {
    java {
        googleJavaFormat()
    }
}

tasks.named('check') {
    dependsOn tasks.named('spotlessCheck')
}

jlink {
    imageName = 'internet-cafe-desktop'
    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']

    launcher {
        name = 'internet-cafe'
        jvmArgs = ['-Dfile.encoding=UTF-8']
    }
}

tasks.named('jlink') {
    dependsOn tasks.named('classes')
}
