name: deploy-prod

# QA-17: cada etiqueta `v*` despliega producción.
# API: etiqueta de main → cabeza única de Alembic → migración con el rol migrador →
#      deploy hook de Render → humo.
# Web: CLI de Vercel contra el proyecto de producción, después de que la API quede sana.
# El environment `prod` debe tener revisores obligatorios (Settings → Environments → prod):
# ahí está la aprobación manual.
# Secretos del environment prod: DATABASE_URL_MIGRATOR, RENDER_DEPLOY_HOOK, VERCEL_TOKEN,
# VERCEL_ORG_ID, VERCEL_PROJECT_ID. Variables: PROD_API_URL, PROD_WEB_URL y,
# opcional, PROD_ESPERA_DEPLOY_S.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  api:
    name: API en producción
    runs-on: ubuntu-latest
    environment: prod
    # Mismo grupo para todo lo que toca la base de prod: uno a la vez y sin cancelar
    # el que está corriendo (nunca cortar una migración a la mitad)
    concurrency:
      group: prod-db
      cancel-in-progress: false
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Backend
    env:
      APP_ENV: prod
      # Settings exige SECRET_KEY al importarse; ni Alembic ni el humo la usan
      SECRET_KEY: no-se-usa-en-el-despliegue
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar que la etiqueta sale de main
        working-directory: .
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no apunta a un commit de main."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Verificar una sola cabeza de Alembic
        env:
          # `alembic heads` no se conecta; la URL solo satisface a Settings
          DATABASE_URL: postgresql+asyncpg://sin-conexion@localhost/no_se_usa
        run: |
          heads="$(alembic heads)"
          echo "$heads"
          n="$(echo "$heads" | grep -c '(head)')"
          if [ "$n" -ne 1 ]; then
            echo "::error::Hay $n cabezas de Alembic; debe haber exactamente 1."
            exit 1
          fi

      - name: Migrar con el rol migrador
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATOR }}
          DATABASE_URL_MIGRATOR: ${{ secrets.DATABASE_URL_MIGRATOR }}
        run: |
          if [ -z "$DATABASE_URL_MIGRATOR" ]; then
            echo "::error::Falta el secret DATABASE_URL_MIGRATOR en el environment prod."
            exit 1
          fi
          alembic upgrade head

      - name: Disparar el deploy hook de Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::Falta el secret RENDER_DEPLOY_HOOK en el environment prod."
            exit 1
          fi
          curl -fsS -o /dev/null -X POST "$RENDER_DEPLOY_HOOK"
          echo "Deploy solicitado a Render."

      - name: Prueba de humo de la API
        env:
          PROD_API_URL: ${{ vars.PROD_API_URL }}
          # El hook responde al instante y la versión anterior sigue en línea mientras
          # Render construye; se espera antes de probar para no validar la versión vieja.
          ESPERA_DEPLOY_S: ${{ vars.PROD_ESPERA_DEPLOY_S || '420' }}
        run: |
          if [ -z "$PROD_API_URL" ]; then
            echo "::error::Falta la variable PROD_API_URL en el environment prod."
            exit 1
          fi
          echo "Esperando ${ESPERA_DEPLOY_S}s a que Render publique la versión nueva..."
          sleep "$ESPERA_DEPLOY_S"

          probar() { # $1 = URL; hasta 10 intentos, 30 s entre cada uno
            for i in $(seq 1 10); do
              codigo="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$1" || true)"
              if [ "$codigo" = "200" ]; then
                echo "OK  $1"
                return 0
              fi
              echo "Intento $i: $1 respondió $codigo"
              sleep 30
            done
            echo "::error::$1 no respondió 200."
            return 1
          }

          probar "$PROD_API_URL/healthz"
          probar "$PROD_API_URL/readyz"

  web:
    name: Web en producción
    # La web solo sale si la API quedó sana: así /api no apunta a un backend roto
    needs: api
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - name: Verificar los secretos de Vercel
        run: |
          for var in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!var}" ]; then
              echo "::error::Falta el secret $var en el environment prod."
              exit 1
            fi
          done
      - name: Instalar la CLI de Vercel
        run: npm install --global vercel@latest
      - name: Traer la configuración del proyecto de producción
        run: vercel pull --yes --environment=production
      - name: Construir
        run: vercel build --prod
      - name: Desplegar
        run: vercel deploy --prebuilt --prod

      - name: Prueba de humo de la web
        env:
          PROD_WEB_URL: ${{ vars.PROD_WEB_URL }}
        run: |
          if [ -z "$PROD_WEB_URL" ]; then
            echo "::warning::Sin PROD_WEB_URL no hay humo de la web."
            exit 0
          fi
          for i in $(seq 1 5); do
            codigo="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$PROD_WEB_URL/" || true)"
            if [ "$codigo" = "200" ]; then
              echo "OK  $PROD_WEB_URL/"
              exit 0
            fi
            echo "Intento $i: $PROD_WEB_URL/ respondió $codigo"
            sleep 15
          done
          echo "::error::$PROD_WEB_URL/ no respondió 200."
          exit 1